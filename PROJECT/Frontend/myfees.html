<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Fees | Smart Hostel Management System
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "DM Sans", sans-serif;

            min-height: 100vh;

            color: #29233a;

            background:
                radial-gradient(
                    circle at 8% 10%,
                    rgba(124, 58, 237, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 92% 15%,
                    rgba(236, 72, 153, 0.13),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8f7ff,
                    #fff7fb
                );

        }


        /* NAVBAR */

        nav {

            height: 72px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(255,255,255,0.88);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(124,58,237,0.12);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            color: #6d28d9;

            font-size: 20px;

            font-weight: 700;

        }


        .logo span {

            display: block;

            color: #777;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 500;

        }


        .nav-actions {

            display: flex;

            gap: 10px;

        }


        .nav-btn {

            border: none;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 12px;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        .dashboard-btn {

            background: #f0eaff;

            color: #6d28d9;

        }


        .logout-btn {

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            color: white;

        }


        .nav-btn:hover {

            transform: translateY(-2px);

        }


        /* MAIN */

        .container {

            width: min(1200px, 92%);

            margin: 42px auto 70px;

        }


        .page-header {

            margin-bottom: 28px;

        }


        .page-header h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(34px, 5vw, 48px);

            font-weight: 600;

            color: #281f3c;

        }


        .page-header p {

            color: #777;

            margin-top: 8px;

            font-size: 15px;

        }


        /* STUDENT SELECTOR */

        .selector-box {

            margin-top: 22px;

            padding: 18px 20px;

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(44,30,90,0.06);

        }


        .selector-label {

            display: block;

            color: #6d5d7e;

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 8px;

        }


        #studentSelector {

            width: 100%;

            max-width: 500px;

            padding: 13px 15px;

            border: 1px solid #ddd4ea;

            border-radius: 12px;

            background: white;

            color: #342750;

            font-family: inherit;

            font-size: 13px;

            outline: none;

            cursor: pointer;

            transition: 0.3s;

        }


        #studentSelector:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(124,58,237,0.10);

        }


        /* SUMMARY */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin: 26px 0;

        }


        .summary-card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 20px;

            padding: 23px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

            transition: 0.3s;

        }


        .summary-card:hover {

            transform: translateY(-3px);

        }


        .summary-label {

            color: #8b8498;

            font-size: 12px;

            margin-bottom: 8px;

        }


        .summary-value {

            font-size: 27px;

            font-weight: 700;

            color: #342750;

        }


        .total-value {

            color: #7c3aed;

        }


        .paid-value {

            color: #16a34a;

        }


        .pending-value {

            color: #db2777;

        }


        /* CARD */

        .card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 22px;

            padding: 26px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

        }


        .card-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 22px;

        }


        .card h2 {

            font-family:
                "Playfair Display",
                serif;

            font-size: 24px;

            font-weight: 600;

            color: #342750;

        }


        /* TABLE */

        .table-wrapper {

            overflow-x: auto;

        }


        table {

            width: 100%;

            min-width: 700px;

            border-collapse: collapse;

        }


        th {

            text-align: left;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f4edff,
                    #fff0f8
                );

            color: #5b4678;

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

        }


        td {

            padding: 15px 14px;

            border-bottom:
                1px solid #eee;

            color: #40384d;

            font-size: 13px;

        }


        tr:hover td {

            background: #fcfaff;

        }


        /* STATUS */

        .status {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

        }


        .status-paid {

            background: #dcfce7;

            color: #15803d;

        }


        .status-pending {

            background: #fef3c7;

            color: #a16207;

        }


        .status-other {

            background: #ede9fe;

            color: #6d28d9;

        }


        /* EMPTY */

        .empty {

            padding: 45px 20px;

            text-align: center;

            color: #888;

        }


        .error {

            padding: 15px;

            margin-top: 20px;

            border-radius: 12px;

            background: #fef2f2;

            color: #dc2626;

            font-size: 13px;

        }


        /* RESPONSIVE */

        @media(max-width:800px) {

            .summary-grid {

                grid-template-columns: 1fr;

            }


            .card-header {

                align-items: flex-start;

                flex-direction: column;

            }

        }


        @media(max-width:600px) {

            nav {

                padding: 0 4%;

            }


            .nav-btn {

                padding: 8px 10px;

                font-size: 11px;

            }


            .container {

                width: 94%;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            SMART HOSTEL

            <span>
                MANAGEMENT SYSTEM
            </span>

        </div>


        <div class="nav-actions">

            <a
                href="dashboard.html"
                class="nav-btn dashboard-btn"
            >
                Dashboard
            </a>


            <button
                class="nav-btn logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- MAIN -->

    <div class="container">


        <!-- HEADER -->

        <div class="page-header">

            <h1>
                My Fees
            </h1>

            <p>
                View hostel fee payments and payment status.
            </p>


            <!-- STUDENT SELECTOR -->

            <div class="selector-box">

                <label
                    class="selector-label"
                    for="studentSelector"
                >
                    Select Student
                </label>


                <select
                    id="studentSelector"
                    onchange="showStudentFees(this.value)"
                >

                    <option value="">
                        Loading students...
                    </option>

                </select>

            </div>

        </div>



        <!-- SUMMARY -->

        <div class="summary-grid">


            <div class="summary-card">

                <div class="summary-label">
                    Total Fees
                </div>

                <div
                    class="summary-value total-value"
                    id="totalFees"
                >
                    ₹0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Paid Amount
                </div>

                <div
                    class="summary-value paid-value"
                    id="paidAmount"
                >
                    ₹0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Pending Amount
                </div>

                <div
                    class="summary-value pending-value"
                    id="pendingAmount"
                >
                    ₹0
                </div>

            </div>


        </div>



        <!-- FEES -->

        <div class="card">


            <div class="card-header">

                <h2>
                    Fee Payment History
                </h2>

            </div>


            <div
                id="feeTable"
                class="table-wrapper"
            >

                <div class="empty">

                    Loading fee details...

                </div>

            </div>


            <div id="errorMessage"></div>


        </div>


    </div>



    <script>

        const API =
            "http://localhost:3000/api";


        /* CURRENT USER */

        const loggedUser =
            JSON.parse(
                localStorage.getItem("user")
            );


        /* LOGIN CHECK */

        if (!loggedUser) {

            window.location.href =
                "login.html";

        }


        /* DATA */

        let allStudents = [];

        let allFees = [];


        /* LOGOUT */

        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        /* FORMAT CURRENCY */

        function formatCurrency(amount) {

            const value =
                Number(amount) || 0;

            return value.toLocaleString(
                "en-IN",
                {
                    style: "currency",
                    currency: "INR",
                    maximumFractionDigits: 2
                }
            );

        }


        /* FORMAT DATE */

        function formatDate(dateString) {

            if (!dateString) {

                return "-";

            }


            const date =
                new Date(dateString);


            if (isNaN(date.getTime())) {

                return "-";

            }


            return date.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /* LOAD DATA */

        async function loadData() {

            try {

                document.getElementById(
                    "errorMessage"
                ).innerHTML = "";


                const [
                    studentsResponse,
                    feesResponse
                ] = await Promise.all([

                    fetch(`${API}/students`),

                    fetch(`${API}/fees`)

                ]);


                if (
                    !studentsResponse.ok ||
                    !feesResponse.ok
                ) {

                    throw new Error(
                        "Unable to load fee information."
                    );

                }


                allStudents =
                    await studentsResponse.json();


                allFees =
                    await feesResponse.json();


                populateStudents();


            }

            catch (error) {

                document.getElementById(
                    "feeTable"
                ).innerHTML = `

                    <div class="empty">

                        Unable to load fee details.

                    </div>

                `;


                document.getElementById(
                    "errorMessage"
                ).innerHTML = `

                    <div class="error">

                        ${error.message}

                    </div>

                `;

            }

        }


        /* POPULATE STUDENTS */

        function populateStudents() {

            const selector =
                document.getElementById(
                    "studentSelector"
                );


            selector.innerHTML = "";


            if (!allStudents.length) {

                selector.innerHTML = `

                    <option value="">
                        No students found
                    </option>

                `;

                showStudentFees("");

                return;

            }


            allStudents.forEach(
                student => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        student.student_id;


                    option.textContent =
                        `${student.name} — ${student.student_id}`;


                    selector.appendChild(
                        option
                    );

                }
            );


            /*
                Logged-in student is selected
                first when student_id is available.
            */

            let selectedId =
                loggedUser &&
                loggedUser.student_id
                    ? String(
                        loggedUser.student_id
                    )
                    : "";


            const exists =
                allStudents.some(
                    student =>
                        String(
                            student.student_id
                        ) === selectedId
                );


            if (!exists) {

                selectedId =
                    String(
                        allStudents[0].student_id
                    );

            }


            selector.value =
                selectedId;


            showStudentFees(
                selectedId
            );

        }


        /* SHOW SELECTED STUDENT FEES */

        function showStudentFees(
            studentId
        ) {


            const selectedFees =
                allFees.filter(
                    fee =>
                        String(
                            fee.student_id
                        ) === String(
                            studentId
                        )
                );


            updateSummary(
                selectedFees
            );


            displayFees(
                selectedFees
            );

        }


        /* UPDATE SUMMARY */

        function updateSummary(
            fees
        ) {


            const total =
                fees.reduce(
                    (sum, fee) =>
                        sum +
                        Number(
                            fee.amount
                        ),
                    0
                );


            const paid =
                fees
                .filter(
                    fee =>
                        String(
                            fee.status
                        ).toLowerCase()
                        === "paid"
                )
                .reduce(
                    (sum, fee) =>
                        sum +
                        Number(
                            fee.amount
                        ),
                    0
                );


            const pending =
                fees
                .filter(
                    fee =>
                        String(
                            fee.status
                        ).toLowerCase()
                        === "pending"
                )
                .reduce(
                    (sum, fee) =>
                        sum +
                        Number(
                            fee.amount
                        ),
                    0
                );


            document.getElementById(
                "totalFees"
            ).textContent =
                formatCurrency(total);


            document.getElementById(
                "paidAmount"
            ).textContent =
                formatCurrency(paid);


            document.getElementById(
                "pendingAmount"
            ).textContent =
                formatCurrency(pending);

        }


        /* DISPLAY FEES */

        function displayFees(
            fees
        ) {


            const table =
                document.getElementById(
                    "feeTable"
                );


            if (!fees.length) {

                table.innerHTML = `

                    <div class="empty">

                        No fee records found
                        for this student.

                    </div>

                `;

                return;

            }


            table.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                Payment ID
                            </th>

                            <th>
                                Student
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Payment Date
                            </th>

                            <th>
                                Payment Method
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            fees
                            .map(
                                fee => {

                                    const status =
                                        String(
                                            fee.status
                                            || ""
                                        ).toLowerCase();


                                    let statusClass =
                                        "status-other";


                                    if (
                                        status ===
                                        "paid"
                                    ) {

                                        statusClass =
                                            "status-paid";

                                    }

                                    else if (
                                        status ===
                                        "pending"
                                    ) {

                                        statusClass =
                                            "status-pending";

                                    }


                                    return `

                                        <tr>

                                            <td>
                                                ${
                                                    fee.payment_id
                                                    || "-"
                                                }
                                            </td>

                                            <td>
                                                ${
                                                    fee.student_name
                                                    || "-"
                                                }
                                            </td>

                                            <td>
                                                ${
                                                    formatCurrency(
                                                        fee.amount
                                                    )
                                                }
                                            </td>

                                            <td>
                                                ${
                                                    formatDate(
                                                        fee.payment_date
                                                    )
                                                }
                                            </td>

                                            <td>
                                                ${
                                                    fee.payment_method
                                                    || "-"
                                                }
                                            </td>

                                            <td>

                                                <span
                                                    class="
                                                        status
                                                        ${statusClass}
                                                    "
                                                >

                                                    ${
                                                        fee.status
                                                        || "-"
                                                    }

                                                </span>

                                            </td>

                                        </tr>

                                    `;

                                }
                            )
                            .join("")
                        }

                    </tbody>

                </table>

            `;

        }


        /* START */

        if (loggedUser) {

            loadData();

        }

    </script>


</body>

</html>
