<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Complaints | Smart Hostel Management System
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: "DM Sans", sans-serif;

            min-height: 100vh;

            color: #29233a;

            background:
                radial-gradient(
                    circle at 8% 10%,
                    rgba(124, 58, 237, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 92% 15%,
                    rgba(236, 72, 153, 0.13),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8f7ff,
                    #fff7fb
                );

        }

        /* NAVBAR */

        nav {

            height: 72px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(255,255,255,0.88);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(124,58,237,0.12);

            position: sticky;

            top: 0;

            z-index: 100;

        }

        .logo {

            color: #6d28d9;

            font-size: 20px;

            font-weight: 700;

        }

        .logo span {

            display: block;

            color: #777;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 500;

        }

        .nav-actions {

            display: flex;

            gap: 10px;

        }

        .nav-btn {

            border: none;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 12px;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }

        .dashboard-btn {

            background: #f0eaff;

            color: #6d28d9;

        }

        .logout-btn {

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            color: white;

        }

        .nav-btn:hover {

            transform: translateY(-2px);

        }

        /* MAIN */

        .container {

            width: min(1200px, 92%);

            margin: 42px auto 70px;

        }

        .page-header {

            margin-bottom: 28px;

        }

        .page-header h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(34px, 5vw, 48px);

            font-weight: 600;

            color: #281f3c;

        }

        .page-header p {

            color: #777;

            margin-top: 8px;

            font-size: 15px;

        }

        /* SELECTOR */

        .selector-box {

            margin-top: 22px;

            padding: 18px 20px;

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(44,30,90,0.06);

        }

        .selector-label {

            display: block;

            color: #6d5d7e;

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 8px;

        }

        #studentSelector {

            width: 100%;

            max-width: 500px;

            padding: 13px 15px;

            border: 1px solid #ddd4ea;

            border-radius: 12px;

            background: white;

            color: #342750;

            font-family: inherit;

            font-size: 13px;

            outline: none;

            cursor: pointer;

        }

        #studentSelector:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(124,58,237,0.10);

        }

        /* SUMMARY */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin: 26px 0;

        }

        .summary-card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 20px;

            padding: 22px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

            transition: 0.3s;

        }

        .summary-card:hover {

            transform: translateY(-3px);

        }

        .summary-label {

            color: #8b8498;

            font-size: 12px;

            margin-bottom: 8px;

        }

        .summary-value {

            font-size: 27px;

            font-weight: 700;

            color: #342750;

        }

        .total-value {

            color: #7c3aed;

        }

        .pending-value {

            color: #db2777;

        }

        .progress-value {

            color: #d97706;

        }

        .resolved-value {

            color: #16a34a;

        }

        /* CARD */

        .card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 22px;

            padding: 26px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

        }

        .card-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;

        }

        .card h2 {

            font-family:
                "Playfair Display",
                serif;

            font-size: 24px;

            font-weight: 600;

            color: #342750;

        }

        /* TABLE */

        .table-wrapper {

            overflow-x: auto;

        }

        table {

            width: 100%;

            min-width: 850px;

            border-collapse: collapse;

        }

        th {

            text-align: left;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f4edff,
                    #fff0f8
                );

            color: #5b4678;

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

        }

        td {

            padding: 15px 14px;

            border-bottom:
                1px solid #eee;

            color: #40384d;

            font-size: 13px;

        }

        tr:hover td {

            background: #fcfaff;

        }

        /* TYPE */

        .type {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: #ede9fe;

            color: #6d28d9;

            font-size: 10px;

            font-weight: 700;

        }

        /* STATUS */

        .status {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

        }

        .status-pending {

            background: #fef3c7;

            color: #a16207;

        }

        .status-progress {

            background: #dbeafe;

            color: #1d4ed8;

        }

        .status-resolved {

            background: #dcfce7;

            color: #15803d;

        }

        .status-other {

            background: #ede9fe;

            color: #6d28d9;

        }

        /* EMPTY */

        .empty {

            padding: 45px 20px;

            text-align: center;

            color: #888;

        }

        .error {

            padding: 15px;

            margin-top: 20px;

            border-radius: 12px;

            background: #fef2f2;

            color: #dc2626;

            font-size: 13px;

        }

        /* RESPONSIVE */

        @media(max-width:1000px) {

            .summary-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }

        @media(max-width:650px) {

            nav {

                padding: 0 4%;

            }

            .nav-btn {

                padding: 8px 10px;

                font-size: 11px;

            }

            .container {

                width: 94%;

            }

            .summary-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            SMART HOSTEL

            <span>
                MANAGEMENT SYSTEM
            </span>

        </div>


        <div class="nav-actions">

            <a
                href="dashboard.html"
                class="nav-btn dashboard-btn"
            >
                Dashboard
            </a>


            <button
                class="nav-btn logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- MAIN -->

    <div class="container">


        <!-- HEADER -->

        <div class="page-header">

            <h1>
                My Complaints
            </h1>

            <p>
                View complaints and their current resolution status.
            </p>


            <!-- STUDENT SELECTOR -->

            <div class="selector-box">

                <label
                    class="selector-label"
                    for="studentSelector"
                >
                    Select Student
                </label>


                <select
                    id="studentSelector"
                    onchange="showStudentComplaints(this.value)"
                >

                    <option value="">
                        Loading students...
                    </option>

                </select>

            </div>

        </div>



        <!-- SUMMARY -->

        <div class="summary-grid">


            <div class="summary-card">

                <div class="summary-label">
                    Total Complaints
                </div>

                <div
                    class="summary-value total-value"
                    id="totalComplaints"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Pending
                </div>

                <div
                    class="summary-value pending-value"
                    id="pendingComplaints"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    In Progress
                </div>

                <div
                    class="summary-value progress-value"
                    id="progressComplaints"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Resolved
                </div>

                <div
                    class="summary-value resolved-value"
                    id="resolvedComplaints"
                >
                    0
                </div>

            </div>


        </div>



        <!-- COMPLAINTS -->

        <div class="card">


            <div class="card-header">

                <h2>
                    Complaint History
                </h2>

            </div>


            <div
                id="complaintTable"
                class="table-wrapper"
            >

                <div class="empty">

                    Loading complaints...

                </div>

            </div>


            <div id="errorMessage"></div>


        </div>


    </div>



    <script>

        const API =
            "http://localhost:3000/api";


        /* CURRENT USER */

        const loggedUser =
            JSON.parse(
                localStorage.getItem("user")
            );


        /* LOGIN CHECK */

        if (!loggedUser) {

            window.location.href =
                "login.html";

        }


        /* DATA */

        let allStudents = [];

        let allComplaints = [];


        /* LOGOUT */

        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        /* DATE FORMAT */

        function formatDate(dateString) {

            if (!dateString) {

                return "-";

            }


            const date =
                new Date(dateString);


            if (isNaN(date.getTime())) {

                return "-";

            }


            return date.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /* LOAD DATA */

        async function loadData() {

            try {

                document.getElementById(
                    "errorMessage"
                ).innerHTML = "";


                const [
                    studentsResponse,
                    complaintsResponse
                ] = await Promise.all([

                    fetch(`${API}/students`),

                    fetch(`${API}/complaints`)

                ]);


                if (
                    !studentsResponse.ok ||
                    !complaintsResponse.ok
                ) {

                    throw new Error(
                        "Unable to load complaint information."
                    );

                }


                allStudents =
                    await studentsResponse.json();


                allComplaints =
                    await complaintsResponse.json();


                populateStudents();

            }

            catch (error) {

                document.getElementById(
                    "complaintTable"
                ).innerHTML = `

                    <div class="empty">

                        Unable to load complaint details.

                    </div>

                `;


                document.getElementById(
                    "errorMessage"
                ).innerHTML = `

                    <div class="error">

                        ${error.message}

                    </div>

                `;

            }

        }


        /* STUDENT DROPDOWN */

        function populateStudents() {

            const selector =
                document.getElementById(
                    "studentSelector"
                );


            selector.innerHTML = "";


            if (!allStudents.length) {

                selector.innerHTML = `

                    <option value="">
                        No students found
                    </option>

                `;

                showStudentComplaints("");

                return;

            }


            allStudents.forEach(
                student => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        student.student_id;


                    option.textContent =
                        `${student.name} — ${student.student_id}`;


                    selector.appendChild(
                        option
                    );

                }
            );


            /*
                Select logged-in student first
                when student_id is available.
            */

            let selectedId =
                loggedUser &&
                loggedUser.student_id
                    ? String(
                        loggedUser.student_id
                    )
                    : "";


            const exists =
                allStudents.some(
                    student =>
                        String(
                            student.student_id
                        ) === selectedId
                );


            if (!exists) {

                selectedId =
                    String(
                        allStudents[0].student_id
                    );

            }


            selector.value =
                selectedId;


            showStudentComplaints(
                selectedId
            );

        }


        /* SHOW COMPLAINTS */

        function showStudentComplaints(
            studentId
        ) {


            const selectedComplaints =
                allComplaints.filter(
                    complaint =>
                        String(
                            complaint.student_id
                        ) === String(
                            studentId
                        )
                );


            updateSummary(
                selectedComplaints
            );


            displayComplaints(
                selectedComplaints
            );

        }


        /* SUMMARY */

        function updateSummary(
            complaints
        ) {


            const pending =
                complaints.filter(
                    complaint =>
                        String(
                            complaint.status
                        ).toLowerCase()
                        === "pending"
                ).length;


            const progress =
                complaints.filter(
                    complaint =>
                        String(
                            complaint.status
                        ).toLowerCase()
                        === "in progress"
                ).length;


            const resolved =
                complaints.filter(
                    complaint =>
                        String(
                            complaint.status
                        ).toLowerCase()
                        === "resolved"
                ).length;


            document.getElementById(
                "totalComplaints"
            ).textContent =
                complaints.length;


            document.getElementById(
                "pendingComplaints"
            ).textContent =
                pending;


            document.getElementById(
                "progressComplaints"
            ).textContent =
                progress;


            document.getElementById(
                "resolvedComplaints"
            ).textContent =
                resolved;

        }


        /* DISPLAY */

        function displayComplaints(
            complaints
        ) {


            const table =
                document.getElementById(
                    "complaintTable"
                );


            if (!complaints.length) {

                table.innerHTML = `

                    <div class="empty">

                        No complaints found
                        for this student.

                    </div>

                `;

                return;

            }


            table.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                Complaint ID
                            </th>

                            <th>
                                Student
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Complaint Date
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            complaints
                            .map(
                                complaint => {

                                    const status =
                                        String(
                                            complaint.status
                                            || ""
                                        ).toLowerCase();


                                    let statusClass =
                                        "status-other";


                                    if (
                                        status ===
                                        "pending"
                                    ) {

                                        statusClass =
                                            "status-pending";

                                    }

                                    else if (
                                        status ===
                                        "in progress"
                                    ) {

                                        statusClass =
                                            "status-progress";

                                    }

                                    else if (
                                        status ===
                                        "resolved"
                                    ) {

                                        statusClass =
                                            "status-resolved";

                                    }


                                    return `

                                        <tr>

                                            <td>
                                                ${
                                                    complaint.complaint_id
                                                    || "-"
                                                }
                                            </td>


                                            <td>
                                                ${
                                                    complaint.student_name
                                                    || "-"
                                                }
                                            </td>


                                            <td>

                                                <span
                                                    class="type"
                                                >

                                                    ${
                                                        complaint.complaint_type
                                                        || "-"
                                                    }

                                                </span>

                                            </td>


                                            <td>
                                                ${
                                                    complaint.description
                                                    || "-"
                                                }
                                            </td>


                                            <td>
                                                ${
                                                    formatDate(
                                                        complaint.complaint_date
                                                    )
                                                }
                                            </td>


                                            <td>

                                                <span
                                                    class="
                                                        status
                                                        ${statusClass}
                                                    "
                                                >

                                                    ${
                                                        complaint.status
                                                        || "-"
                                                    }

                                                </span>

                                            </td>

                                        </tr>

                                    `;

                                }
                            )
                            .join("")
                        }

                    </tbody>

                </table>

            `;

        }


        /* START */

        if (loggedUser) {

            loadData();

        }

    </script>


</body>

</html>
