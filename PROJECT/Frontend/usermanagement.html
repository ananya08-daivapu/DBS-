<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        User Management | Smart Hostel Management System
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "DM Sans", sans-serif;

            min-height: 100vh;

            color: #29233a;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(124, 58, 237, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(236, 72, 153, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8f7ff,
                    #fff7fb
                );

        }


        /* NAVBAR */

        nav {

            height: 72px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(255,255,255,0.88);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(124,58,237,0.12);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            color: #6d28d9;

            font-size: 20px;

            font-weight: 700;

        }


        .logo span {

            display: block;

            color: #777;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 500;

        }


        .nav-actions {

            display: flex;

            gap: 10px;

        }


        .nav-btn {

            border: none;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 12px;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        .dashboard-btn {

            background: #f0eaff;

            color: #6d28d9;

        }


        .logout-btn {

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            color: white;

        }


        .nav-btn:hover {

            transform: translateY(-2px);

        }


        /* MAIN */

        .container {

            width: min(1200px, 92%);

            margin: 42px auto 70px;

        }


        .page-header {

            margin-bottom: 28px;

        }


        .page-header h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(34px, 5vw, 48px);

            font-weight: 600;

            color: #281f3c;

        }


        .page-header p {

            color: #777;

            margin-top: 8px;

            font-size: 15px;

        }


        /* SUMMARY */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 26px;

        }


        .summary-card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 20px;

            padding: 23px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

        }


        .summary-label {

            color: #8b8498;

            font-size: 12px;

            margin-bottom: 8px;

        }


        .summary-value {

            font-size: 28px;

            font-weight: 700;

            color: #342750;

        }


        .admin-count {

            color: #7c3aed;

        }


        .student-count {

            color: #2563eb;

        }


        .warden-count {

            color: #db2777;

        }


        /* CARD */

        .card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 22px;

            padding: 26px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

            margin-bottom: 24px;

        }


        .card-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

        }


        .card h2 {

            font-family:
                "Playfair Display",
                serif;

            font-size: 23px;

            font-weight: 600;

            color: #342750;

        }


        .refresh-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            color: white;

            padding: 10px 15px;

            border-radius: 11px;

            font-family: inherit;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        .refresh-btn:hover {

            transform: translateY(-2px);

        }


        /* TABLE */

        .table-wrapper {

            overflow-x: auto;

        }


        table {

            width: 100%;

            min-width: 650px;

            border-collapse: collapse;

        }


        th {

            text-align: left;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f4edff,
                    #fff0f8
                );

            color: #5b4678;

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

        }


        td {

            padding: 15px 14px;

            border-bottom:
                1px solid #eee;

            color: #40384d;

            font-size: 13px;

        }


        tr:hover td {

            background: #fcfaff;

        }


        /* ROLE */

        .role {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

        }


        .role-admin {

            background: #ede9fe;

            color: #6d28d9;

        }


        .role-student {

            background: #dbeafe;

            color: #1d4ed8;

        }


        .role-warden {

            background: #fce7f3;

            color: #be185d;

        }


        /* STATUS */

        .status {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

        }


        .status-active {

            background: #dcfce7;

            color: #15803d;

        }


        .status-inactive {

            background: #fee2e2;

            color: #b91c1c;

        }


        /* EMPTY */

        .empty {

            padding: 40px 20px;

            text-align: center;

            color: #888;

        }


        .error {

            padding: 15px;

            background: #fef2f2;

            color: #dc2626;

            border-radius: 12px;

            font-size: 14px;

            margin-top: 20px;

        }


        /* ACCESS MESSAGE */

        .access-message {

            display: none;

            padding: 30px;

            background:
                rgba(255,255,255,0.92);

            border:
                1px solid
                rgba(220,38,38,0.12);

            border-radius: 20px;

            color: #b91c1c;

            text-align: center;

        }


        .access-message h2 {

            font-family:
                "Playfair Display",
                serif;

            margin-bottom: 8px;

        }


        /* RESPONSIVE */

        @media(max-width:800px) {

            .summary-grid {

                grid-template-columns: 1fr;

            }


            .card-header {

                align-items: flex-start;

                flex-direction: column;

            }

        }


        @media(max-width:600px) {

            nav {

                padding: 0 4%;

            }


            .nav-btn {

                padding: 8px 10px;

                font-size: 12px;

            }


            .container {

                width: 94%;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            SMART HOSTEL

            <span>
                MANAGEMENT SYSTEM
            </span>

        </div>


        <div class="nav-actions">

            <a
                href="dashboard.html"
                class="nav-btn dashboard-btn"
            >
                Dashboard
            </a>


            <button
                class="nav-btn logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>



    <div class="container">


        <!-- HEADER -->

        <div class="page-header">

            <h1>
                User Management
            </h1>

            <p>
                View registered users and their system roles.
            </p>

        </div>



        <!-- ACCESS MESSAGE -->

        <div
            id="accessMessage"
            class="access-message"
        >

            <h2>
                Admin Access Required
            </h2>

            <p>
                Only administrators can access User Management.
            </p>

        </div>



        <!-- ADMIN CONTENT -->

        <div id="adminContent">


            <!-- SUMMARY -->

            <div class="summary-grid">


                <div class="summary-card">

                    <div class="summary-label">
                        Administrators
                    </div>

                    <div
                        class="summary-value admin-count"
                        id="adminCount"
                    >
                        0
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        Students
                    </div>

                    <div
                        class="summary-value student-count"
                        id="studentCount"
                    >
                        0
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        Wardens
                    </div>

                    <div
                        class="summary-value warden-count"
                        id="wardenCount"
                    >
                        0
                    </div>

                </div>


            </div>



            <!-- USERS -->

            <div class="card">


                <div class="card-header">

                    <h2>
                        Registered Users
                    </h2>


                    <button
                        class="refresh-btn"
                        onclick="loadUsers()"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="userTable"
                    class="table-wrapper"
                >

                    <div class="empty">
                        Loading users...
                    </div>

                </div>


                <div id="errorMessage"></div>


            </div>


        </div>


    </div>



    <script>

        const API =
            "http://localhost:3000/api";


        /* CURRENT USER */

        const loggedUser =
            JSON.parse(
                localStorage.getItem("user")
            );


        /* LOGIN CHECK */

        if (!loggedUser) {

            window.location.href =
                "login.html";

        }


        /* ADMIN CHECK */

        if (
            loggedUser &&
            loggedUser.role !== "admin"
        ) {

            document.getElementById(
                "adminContent"
            ).style.display = "none";


            document.getElementById(
                "accessMessage"
            ).style.display = "block";

        }


        /* LOGOUT */

        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        /* LOAD USERS */

        async function loadUsers() {

            if (
                !loggedUser ||
                loggedUser.role !== "admin"
            ) {

                return;

            }


            try {

                document.getElementById(
                    "errorMessage"
                ).innerHTML = "";


                /*
                    The current backend does not
                    have a /api/users endpoint.

                    We therefore display the users
                    already available through the
                    authentication database.
                */

                const response =
                    await fetch(
                        `${API}/users`
                    );


                if (!response.ok) {

                    throw new Error(
                        "User API is not available yet."
                    );

                }


                const users =
                    await response.json();


                displayUsers(users);


            }

            catch (error) {

                document.getElementById(
                    "userTable"
                ).innerHTML = `

                    <div class="empty">

                        User Management API
                        is not connected yet.

                        <br><br>

                        Backend user API needs
                        to be added.

                    </div>

                `;


                document.getElementById(
                    "errorMessage"
                ).innerHTML = `

                    <div class="error">

                        ${error.message}

                    </div>

                `;

            }

        }


        /* DISPLAY USERS */

        function displayUsers(users) {


            const adminCount =
                users.filter(
                    user =>
                    String(user.role).toLowerCase()
                    === "admin"
                ).length;


            const studentCount =
                users.filter(
                    user =>
                    String(user.role).toLowerCase()
                    === "student"
                ).length;


            const wardenCount =
                users.filter(
                    user =>
                    String(user.role).toLowerCase()
                    === "warden"
                ).length;


            document.getElementById(
                "adminCount"
            ).textContent =
                adminCount;


            document.getElementById(
                "studentCount"
            ).textContent =
                studentCount;


            document.getElementById(
                "wardenCount"
            ).textContent =
                wardenCount;


            const table =
                document.getElementById(
                    "userTable"
                );


            if (!users.length) {

                table.innerHTML = `

                    <div class="empty">

                        No users found.

                    </div>

                `;

                return;

            }


            table.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                User ID
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Student ID
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            users
                            .map(
                                user => {

                                    let roleClass =
                                        "role-student";


                                    if (
                                        user.role ===
                                        "admin"
                                    ) {

                                        roleClass =
                                            "role-admin";

                                    }


                                    else if (
                                        user.role ===
                                        "warden"
                                    ) {

                                        roleClass =
                                            "role-warden";

                                    }


                                    return `

                                        <tr>

                                            <td>
                                                ${
                                                    user.user_id
                                                    || "-"
                                                }
                                            </td>

                                            <td>
                                                ${
                                                    user.email
                                                    || "-"
                                                }
                                            </td>

                                            <td>

                                                <span
                                                    class="
                                                        role
                                                        ${roleClass}
                                                    "
                                                >

                                                    ${
                                                        user.role
                                                        || "-"
                                                    }

                                                </span>

                                            </td>

                                            <td>
                                                ${
                                                    user.student_id
                                                    ? user.student_id
                                                    : user.role === "admin"
                                                        ? "Admin Account"
                                                        : user.role === "warden"
                                                            ? "Warden Account"
                                                            : "Not Assigned"
                                                }
                                            </td>

                                        </tr>

                                    `;

                                }
                            )
                            .join("")
                        }

                    </tbody>

                </table>

            `;

        }


        /*
            Start only for admin.
        */

        if (
            loggedUser &&
            loggedUser.role === "admin"
        ) {

            loadUsers();

        }

    </script>


</body>

</html>
