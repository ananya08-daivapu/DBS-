<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fee Management - Smart Hostel Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #27213c;
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            font-size: 30px;
            color: #4c1d95;
        }

        .page-header p {
            margin-top: 6px;
            color: #777;
        }

        .back-btn {
            text-decoration: none;
            background: #6d28d9;
            color: white;
            padding: 11px 20px;
            border-radius: 10px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(76, 29, 149, 0.08);
        }

        .card h3 {
            color: #777;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 28px;
            font-weight: bold;
            color: #4c1d95;
        }

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(76, 29, 149, 0.08);
            overflow-x: auto;
        }

        .table-card h2 {
            margin-bottom: 20px;
            color: #4c1d95;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #f3e8ff;
            color: #4c1d95;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #faf8ff;
        }

        .paid {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .loading,
        .error,
        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 800px) {
            .summary {
                grid-template-columns: 1fr;
            }

            body {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="page-header">

        <div>
            <h1>Fee Management</h1>
            <p>Track hostel fee payments and payment status.</p>
        </div>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- SUMMARY CARDS -->

    <div class="summary">

        <div class="card">
            <h3>Total Fee Records</h3>
            <div class="value" id="totalRecords">0</div>
        </div>

        <div class="card">
            <h3>Total Paid</h3>
            <div class="value" id="totalPaid">₹0</div>
        </div>

        <div class="card">
            <h3>Pending Amount</h3>
            <div class="value" id="pendingAmount">₹0</div>
        </div>

    </div>


    <!-- FEE TABLE -->

    <div class="table-card">

        <h2>Fee Payment Records</h2>

        <div id="tableContainer" class="loading">
            Loading fee records...
        </div>

    </div>


    <script>

        const API_URL = "http://localhost:3000/api/fees";


        async function loadFees() {

            const container = document.getElementById("tableContainer");

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Failed to load fee records.");
                }

                const data = await response.json();

                displayFees(data);

            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="error">
                        Unable to load fee records.
                        <br>
                        Make sure the backend server is running.
                    </div>
                `;

            }
        }


        function formatDate(dateString) {

            if (!dateString) {
                return "-";
            }

            const date = new Date(dateString);

            if (isNaN(date.getTime())) {
                return "-";
            }

            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }


        function formatAmount(amount) {

            return "₹" + Number(amount).toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

        }


        function displayFees(data) {

            const container = document.getElementById("tableContainer");

            if (!data || data.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No fee records found.
                    </div>
                `;

                updateSummary([]);

                return;
            }


            let html = `
                <table>

                    <thead>
                        <tr>
                            <th>Payment ID</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Amount</th>
                            <th>Payment Date</th>
                            <th>Payment Method</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
            `;


            data.forEach(record => {

                const status = String(record.status || "");

                let statusHTML = status;

                if (status.toLowerCase() === "paid") {

                    statusHTML = `
                        <span class="paid">
                            Paid
                        </span>
                    `;

                } else if (status.toLowerCase() === "pending") {

                    statusHTML = `
                        <span class="pending">
                            Pending
                        </span>
                    `;

                }


                html += `
                    <tr>

                        <td>${record.payment_id || "-"}</td>

                        <td>${record.student_id || "-"}</td>

                        <td>${record.student_name || "-"}</td>

                        <td>${formatAmount(record.amount)}</td>

                        <td>${formatDate(record.payment_date)}</td>

                        <td>${record.payment_method || "-"}</td>

                        <td>${statusHTML}</td>

                    </tr>
                `;

            });


            html += `
                    </tbody>

                </table>
            `;


            container.innerHTML = html;

            updateSummary(data);

        }


        function updateSummary(data) {

            const totalRecords = data.length;

            let totalPaid = 0;
            let pendingAmount = 0;


            data.forEach(record => {

                const amount = Number(record.amount) || 0;

                if (
                    String(record.status).toLowerCase() === "paid"
                ) {

                    totalPaid += amount;

                }

                if (
                    String(record.status).toLowerCase() === "pending"
                ) {

                    pendingAmount += amount;

                }

            });


            document.getElementById("totalRecords").textContent =
                totalRecords;

            document.getElementById("totalPaid").textContent =
                formatAmount(totalPaid);

            document.getElementById("pendingAmount").textContent =
                formatAmount(pendingAmount);

        }


        loadFees();

    </script>

</body>
</html>
