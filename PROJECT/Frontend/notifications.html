<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Notifications | Smart Hostel Management System
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "DM Sans", sans-serif;

            min-height: 100vh;

            color: #29233a;

            background:
                radial-gradient(
                    circle at 8% 10%,
                    rgba(124, 58, 237, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 92% 15%,
                    rgba(236, 72, 153, 0.13),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8f7ff,
                    #fff7fb
                );

        }


        /* NAVBAR */

        nav {

            height: 72px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(255,255,255,0.88);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(124,58,237,0.12);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            color: #6d28d9;

            font-size: 20px;

            font-weight: 700;

        }


        .logo span {

            display: block;

            color: #777;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 500;

        }


        .nav-actions {

            display: flex;

            gap: 10px;

        }


        .nav-btn {

            border: none;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 12px;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        .dashboard-btn {

            background: #f0eaff;

            color: #6d28d9;

        }


        .logout-btn {

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            color: white;

        }


        .nav-btn:hover {

            transform: translateY(-2px);

        }


        /* MAIN */

        .container {

            width: min(1050px, 92%);

            margin: 42px auto 70px;

        }


        .page-header {

            margin-bottom: 28px;

        }


        .page-header h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(34px, 5vw, 48px);

            font-weight: 600;

            color: #281f3c;

        }


        .page-header p {

            color: #777;

            margin-top: 8px;

            font-size: 15px;

        }


        /* SUMMARY */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 26px;

        }


        .summary-card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 20px;

            padding: 22px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

        }


        .summary-label {

            color: #8b8498;

            font-size: 12px;

            margin-bottom: 8px;

        }


        .summary-value {

            font-size: 28px;

            font-weight: 700;

        }


        .all-value {

            color: #7c3aed;

        }


        .important-value {

            color: #db2777;

        }


        .info-value {

            color: #2563eb;

        }


        /* NOTIFICATION CARD */

        .card {

            background:
                rgba(255,255,255,0.90);

            border:
                1px solid
                rgba(124,58,237,0.10);

            border-radius: 22px;

            padding: 26px;

            box-shadow:
                0 12px 35px
                rgba(44,30,90,0.07);

        }


        .card-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 22px;

        }


        .card h2 {

            font-family:
                "Playfair Display",
                serif;

            font-size: 24px;

            font-weight: 600;

            color: #342750;

        }


        .refresh-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            color: white;

            padding: 10px 15px;

            border-radius: 11px;

            font-family: inherit;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        .refresh-btn:hover {

            transform: translateY(-2px);

        }


        /* NOTIFICATIONS */

        .notification-list {

            display: flex;

            flex-direction: column;

            gap: 14px;

        }


        .notification {

            display: flex;

            align-items: flex-start;

            gap: 15px;

            padding: 18px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #fbf8ff
                );

            border:
                1px solid
                #eee8f5;

            transition: 0.3s;

        }


        .notification:hover {

            transform: translateX(4px);

            box-shadow:
                0 8px 24px
                rgba(60,40,100,0.08);

        }


        .notification-icon {

            width: 44px;

            height: 44px;

            flex-shrink: 0;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;

            background:
                #ede9fe;

        }


        .notification-content {

            flex: 1;

            min-width: 0;

        }


        .notification-title {

            font-size: 14px;

            font-weight: 700;

            color: #342750;

            margin-bottom: 5px;

        }


        .notification-text {

            color: #777;

            font-size: 12px;

            line-height: 1.6;

        }


        .notification-time {

            margin-top: 7px;

            color: #aaa;

            font-size: 10px;

        }


        /* TYPES */

        .notification.important {

            border-left:
                4px solid #ec4899;

        }


        .notification.info {

            border-left:
                4px solid #7c3aed;

        }


        .notification.success {

            border-left:
                4px solid #16a34a;

        }


        .notification.warning {

            border-left:
                4px solid #f59e0b;

        }


        .empty {

            padding: 45px 20px;

            text-align: center;

            color: #888;

        }


        /* RESPONSIVE */

        @media(max-width:700px) {

            .summary-grid {

                grid-template-columns: 1fr;

            }


            .card-header {

                align-items: flex-start;

                flex-direction: column;

            }

        }


        @media(max-width:600px) {

            nav {

                padding: 0 4%;

            }


            .nav-btn {

                padding: 8px 10px;

                font-size: 11px;

            }


            .container {

                width: 94%;

            }


            .notification {

                padding: 14px;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            SMART HOSTEL

            <span>
                MANAGEMENT SYSTEM
            </span>

        </div>


        <div class="nav-actions">

            <a
                href="dashboard.html"
                class="nav-btn dashboard-btn"
            >
                Dashboard
            </a>


            <button
                class="nav-btn logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- MAIN -->

    <div class="container">


        <!-- HEADER -->

        <div class="page-header">

            <h1>
                Notifications
            </h1>

            <p>
                Important hostel updates, fee reminders and system information.
            </p>

        </div>



        <!-- SUMMARY -->

        <div class="summary-grid">


            <div class="summary-card">

                <div class="summary-label">
                    Total Notifications
                </div>

                <div
                    class="summary-value all-value"
                    id="totalNotifications"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Important
                </div>

                <div
                    class="summary-value important-value"
                    id="importantNotifications"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Information
                </div>

                <div
                    class="summary-value info-value"
                    id="infoNotifications"
                >
                    0
                </div>

            </div>


        </div>



        <!-- NOTIFICATION CARD -->

        <div class="card">


            <div class="card-header">

                <h2>
                    Recent Notifications
                </h2>


                <button
                    class="refresh-btn"
                    onclick="loadNotifications()"
                >
                    Refresh
                </button>

            </div>


            <div
                id="notificationList"
                class="notification-list"
            >

                <div class="empty">

                    Loading notifications...

                </div>

            </div>


        </div>


    </div>



    <script>

        /* CURRENT USER */

        const loggedUser =
            JSON.parse(
                localStorage.getItem("user")
            );


        /* LOGIN CHECK */

        if (!loggedUser) {

            window.location.href =
                "login.html";

        }


        /* LOGOUT */

        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        /*
            Notifications are generated from
            the existing project data.

            No separate notification table is
            required for this module.
        */

        function loadNotifications() {


            const notifications = [

                {
                    type: "important",

                    icon: "💳",

                    title: "Fee Payment Reminder",

                    text:
                        "Please check your hostel fee payment status and complete any pending payment.",

                    time:
                        "Hostel Fee Update"
                },


                {
                    type: "info",

                    icon: "🏠",

                    title: "Room Allocation Information",

                    text:
                        "Room allocation details are available in the My Room section.",

                    time:
                        "Room Management"
                },


                {
                    type: "warning",

                    icon: "📝",

                    title: "Complaint Status Update",

                    text:
                        "Check My Complaints regularly to view the latest status of submitted complaints.",

                    time:
                        "Complaint Management"
                },


                {
                    type: "success",

                    icon: "📢",

                    title: "Hostel Management System",

                    text:
                        "Your hostel information is being managed through the centralized Smart Hostel Management System.",

                    time:
                        "System Information"
                },


                {
                    type: "info",

                    icon: "🔔",

                    title: "Profile Information",

                    text:
                        "Keep your student information updated in the My Profile section.",

                    time:
                        "Student Profile"
                }

            ];


            displayNotifications(
                notifications
            );

        }


        /* DISPLAY */

        function displayNotifications(
            notifications
        ) {


            const list =
                document.getElementById(
                    "notificationList"
                );


            const important =
                notifications.filter(
                    notification =>
                        notification.type ===
                        "important"
                ).length;


            const info =
                notifications.filter(
                    notification =>
                        notification.type ===
                        "info"
                ).length;


            document.getElementById(
                "totalNotifications"
            ).textContent =
                notifications.length;


            document.getElementById(
                "importantNotifications"
            ).textContent =
                important;


            document.getElementById(
                "infoNotifications"
            ).textContent =
                info;


            if (!notifications.length) {

                list.innerHTML = `

                    <div class="empty">

                        No notifications available.

                    </div>

                `;

                return;

            }


            list.innerHTML =
                notifications.map(
                    notification => `

                        <div
                            class="
                                notification
                                ${notification.type}
                            "
                        >

                            <div class="notification-icon">

                                ${notification.icon}

                            </div>


                            <div class="notification-content">

                                <div class="notification-title">

                                    ${notification.title}

                                </div>


                                <div class="notification-text">

                                    ${notification.text}

                                </div>


                                <div class="notification-time">

                                    ${notification.time}

                                </div>

                            </div>

                        </div>

                    `
                ).join("");

        }


        /* START */

        if (loggedUser) {

            loadNotifications();

        }

    </script>


</body>

</html>
