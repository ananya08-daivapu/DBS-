<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Allocation - Smart Hostel Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(122, 76, 255, 0.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(255, 102, 174, 0.12),
                    transparent 28%
                ),
                #f7f5fc;

            color: #241650;
        }

        /* NAVBAR */

        .allocation-navbar {
            height: 76px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(90,50,150,0.10);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;
            color: #29185f;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #6d35d9,
                #e64b9a
            );

            color: white;
            font-size: 20px;
        }

        .brand-main {
            display: block;

            font-family: "Playfair Display", serif;

            font-size: 18px;
            font-weight: 600;
        }

        .brand-sub {
            display: block;

            font-size: 10px;
            letter-spacing: 2px;

            color: #876fae;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            border: none;

            padding: 10px 17px;

            border-radius: 24px;

            cursor: pointer;

            font-size: 13px;
        }

        .dashboard-btn {
            background: #eee8fa;
            color: #56318d;
        }

        .logout-btn {
            background: linear-gradient(
                135deg,
                #6337d8,
                #df4f9b
            );

            color: white;
        }

        /* MAIN */

        .allocation-container {
            width: min(1180px, 90%);
            margin: auto;

            padding: 55px 0 80px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-label {
            text-transform: uppercase;

            letter-spacing: 3px;

            font-size: 10px;

            color: #9477bb;
        }

        .page-header h1 {
            margin: 6px 0;

            font-family: "Playfair Display", serif;

            font-size: 40px;

            font-weight: 500;

            color: #281857;
        }

        .page-header p {
            margin: 0;

            color: #807092;
        }

        /* SUMMARY */

        .summary-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }

        .summary-card {
            padding: 24px;

            border-radius: 22px;

            background: rgba(255,255,255,0.88);

            border: 1px solid rgba(95,52,161,0.09);

            box-shadow:
                0 15px 40px rgba(64,35,111,0.07);
        }

        .summary-icon {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .summary-card h2 {
            margin: 0;

            font-size: 28px;
            font-weight: 500;

            color: #301b64;
        }

        .summary-card p {
            margin: 5px 0 0;

            color: #89789b;

            font-size: 13px;
        }

        /* TABLE */

        .table-card {
            background: rgba(255,255,255,0.90);

            border-radius: 25px;

            border: 1px solid rgba(95,52,161,0.09);

            box-shadow:
                0 20px 50px rgba(64,35,111,0.08);

            overflow: hidden;
        }

        .table-header {
            padding: 23px 25px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #eee9f5;
        }

        .table-header h2 {
            margin: 0;

            font-family: "Playfair Display", serif;

            font-weight: 500;

            color: #351b70;
        }

        .search-box {
            padding: 11px 15px;

            border-radius: 22px;

            border: 1px solid #ded5eb;

            outline: none;

            width: 240px;

            font-family: inherit;
        }

        .search-box:focus {
            border-color: #8754d4;

            box-shadow:
                0 0 0 3px rgba(135,84,212,0.10);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;

            padding: 17px 20px;

            background: #f8f5fc;

            color: #65458d;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        td {
            padding: 17px 20px;

            border-top: 1px solid #f0ebf5;

            color: #49396a;

            font-size: 13px;
        }

        tr:hover td {
            background: #fcfaff;
        }

        .active {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: #e5f8ec;

            color: #23804a;

            font-size: 11px;

            font-weight: 600;
        }

        .inactive {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: #ffe6ee;

            color: #b53b65;

            font-size: 11px;

            font-weight: 600;
        }

        .message {
            text-align: center;

            padding: 45px;

            color: #8b799c;
        }

        .error {
            text-align: center;

            padding: 30px;

            color: #b33c62;

            background: #fff0f4;
        }

        @media (max-width: 800px) {

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-box {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="allocation-navbar">

        <a
            href="dashboard.html"
            class="brand">

            <div class="brand-icon">
                🔑
            </div>

            <div>

                <span class="brand-main">
                    SMART HOSTEL
                </span>

                <span class="brand-sub">
                    MANAGEMENT SYSTEM
                </span>

            </div>

        </a>


        <div class="nav-actions">

            <button
                class="nav-btn dashboard-btn"
                onclick="goDashboard()">

                ← Dashboard

            </button>


            <button
                class="nav-btn logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>



    <!-- MAIN -->

    <main class="allocation-container">


        <section class="page-header">

            <div class="page-label">
                HOSTEL MANAGEMENT
            </div>

            <h1>
                Room Allocation
            </h1>

            <p>
                Manage student room assignments and allocation status.
            </p>

        </section>



        <!-- SUMMARY -->

        <section class="summary-grid">


            <div class="summary-card">

                <div class="summary-icon">
                    🔑
                </div>

                <h2 id="totalAllocations">
                    0
                </h2>

                <p>
                    Total Allocations
                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    ✅
                </div>

                <h2 id="activeAllocations">
                    0
                </h2>

                <p>
                    Active Allocations
                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    📋
                </div>

                <h2 id="otherAllocations">
                    0
                </h2>

                <p>
                    Other Records
                </p>

            </div>

        </section>



        <!-- TABLE -->

        <section class="table-card">


            <div class="table-header">

                <h2>
                    Allocation Records
                </h2>


                <input
                    type="text"
                    id="searchInput"
                    class="search-box"
                    placeholder="Search allocations..."
                    onkeyup="searchAllocations()">

            </div>


            <div
                id="tableContainer"
                class="table-wrapper">

                <div class="message">
                    Loading allocation records...
                </div>

            </div>

        </section>

    </main>



    <script>


        /* =========================================
           LOGIN PROTECTION
        ========================================= */

        const loggedUser =
            JSON.parse(localStorage.getItem("user"));


        if (!loggedUser) {

            window.location.href =
                "login.html";

        }


        /* =========================================
           ROLE PROTECTION
        ========================================= */

        const role =
            loggedUser.role.toLowerCase();


        if (
            role !== "admin" &&
            role !== "warden"
        ) {

            window.location.href =
                "dashboard.html";

        }


        /* =========================================
           API
        ========================================= */

        const API_URL =
            "http://localhost:3000/api/allocations";


        let allocations = [];


        /* =========================================
           LOAD ALLOCATIONS
        ========================================= */

        async function loadAllocations() {

            const container =
                document.getElementById(
                    "tableContainer"
                );


            container.innerHTML =
                `<div class="message">
                    Loading allocation records...
                </div>`;


            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        "Unable to load allocations"
                    );

                }


                allocations =
                    await response.json();


                updateSummary();

                displayAllocations(
                    allocations
                );

            }

            catch (error) {

                console.error(error);


                container.innerHTML =
                    `<div class="error">
                        Unable to load allocation data.
                        <br><br>
                        Please make sure the backend server is running.
                    </div>`;

            }

        }

        function formatDate(dateString) {
    if (!dateString) return "-";

    const date = new Date(dateString);

    if (isNaN(date.getTime())) return "-";

    return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}


        /* =========================================
           DISPLAY
        ========================================= */

       function displayAllocations(data) {

    const container =
        document.getElementById("tableContainer");

    if (!data || data.length === 0) {

        container.innerHTML =
            `<div class="message">
                No allocation records found.
            </div>`;

        return;
    }

    const columns =
        Object.keys(data[0]);

    let html =
        `<table>
            <thead>
                <tr>`;

    columns.forEach(column => {

        html +=
            `<th>
                ${formatColumn(column)}
            </th>`;

    });

    html +=
        `</tr>
        </thead>
        <tbody>`;

    data.forEach(record => {

        html += `<tr>`;

        columns.forEach(column => {

            let value =
                record[column];

            /* FORMAT DATE */
            if (
                column.toLowerCase().includes("date")
            ) {
                value = formatDate(value);
            }

            const text =
                String(value ?? "");

            /* ACTIVE STATUS */
            if (
                text.toLowerCase().includes("active")
            ) {

                value =
                    `<span class="active">
                        ${text}
                    </span>`;

            }

            /* INACTIVE STATUS */
            else if (
                text.toLowerCase().includes("inactive")
            ) {

                value =
                    `<span class="inactive">
                        ${text}
                    </span>`;

            }

            html +=
                `<td>
                    ${value ?? ""}
                </td>`;

        });

        html += `</tr>`;

    });

    html +=
        `</tbody>
        </table>`;

    container.innerHTML =
        html;
}
        /* =========================================
           FORMAT COLUMN
        ========================================= */

        function formatColumn(column) {

            return column
                .replace(/_/g, " ")
                .replace(/\b\w/g, letter =>
                    letter.toUpperCase()
                );

        }


        /* =========================================
           SEARCH
        ========================================= */

        function searchAllocations() {

            const search =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase();


            const filtered =
                allocations.filter(record => {

                    return Object.values(record)
                        .join(" ")
                        .toLowerCase()
                        .includes(search);

                });


            displayAllocations(
                filtered
            );

        }


        /* =========================================
           SUMMARY
        ========================================= */

        function updateSummary() {

            const total =
                allocations.length;


            let active = 0;


            allocations.forEach(record => {

                const values =
                    Object.values(record)
                        .join(" ")
                        .toLowerCase();


                if (
                    values.includes("active")
                ) {

                    active++;

                }

            });


            document.getElementById(
                "totalAllocations"
            ).textContent = total;


            document.getElementById(
                "activeAllocations"
            ).textContent = active;


            document.getElementById(
                "otherAllocations"
            ).textContent =
                total - active;

        }


        /* =========================================
           NAVIGATION
        ========================================= */

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        /* =========================================
           LOAD
        ========================================= */

        loadAllocations();

    </script>

</body>

</html>
